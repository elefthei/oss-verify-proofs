# pr.yml: every pull request, and every push to main.
#
# The rules come from the base branch, never from the pull request.  The lint,
# the generator and the check all run from a worktree of the base, and the
# statements they check are the base's: a pull request contributes only its
# proofs/ and counterexamples/ (and, for a release pull request, its facts).
# No job has more than read access, no repository secret is used, and the
# untrusted compile runs in the checker image with no network.
#
#   lint      the repository's rules (tools/oft/README.md), from the base; generated files equal
#             their rendering; the tools' own tests; the plan
#   check     per group of affected harnesses: fetch, build, every proof
#             through its wrapper with its assumptions against the allowlist,
#             counterexamples
#   controls  tests/: positive controls pass and negative controls fail
#   required  the one required status: fails if anything failed, or if the
#             plan named harnesses and none was checked
name: pr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read   # to pull the pinned checker and runner images from ghcr.io
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    # the full-tree lint is single-threaded and took 33-35 min at 36 proofs; then the tools' own tests
    timeout-minutes: 180
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      units: ${{ steps.plan.outputs.units }}
      kind: ${{ steps.kind.outputs.kind }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          path: head
      - name: the base branch, whose tools judge this change
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"
          else base="${{ github.event.before }}"; fi
          case "$base" in ''|0000000000000000000000000000000000000000) base="$(git -C head rev-parse HEAD)" ;; esac
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$base"
          [ -d base/tools/oft ] || { echo "::error::the base branch has no tools/oft: nothing trusted to judge with"; exit 1; }
          git -C head diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "changed paths: $(wc -l < "$RUNNER_TEMP/changed.txt")"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML, hash-pinned, from the base
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      - name: the kind of change
        id: kind
        env:
          ASSOC: ${{ github.event.pull_request.author_association }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          kind=contributor
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              kind=maintainer
              case "$HEAD_REF" in release/*) kind=release ;; esac ;;
          esac
          # a push to main is a pull request that was checked and reviewed
          if [ "${{ github.event_name }}" = push ]; then kind=release; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "kind of change: $kind"
      - name: lint, by the base's rules
        run: |
          set -euo pipefail
          args=(--changed "$RUNNER_TEMP/changed.txt" --pr-kind "${{ steps.kind.outputs.kind }}")
          # before the first release is exported there are no facts, and the text rules still run
          [ -e head/release.yaml ] || args+=(--skeleton)
          PYTHONPATH=base/tools python -m oft --root head lint "${args[@]}"
      - name: generated files equal their rendering
        run: |
          set -euo pipefail
          [ -e head/release.yaml ] || { echo "no facts yet: nothing is rendered"; exit 0; }
          # A maintainer's change to the tools is rendered with the tools it brings,
          # and reviewed; any other change, with the base's.
          tools=base/tools
          if [ "${{ steps.kind.outputs.kind }}" != contributor ] && grep -q '^tools/oft/' "$RUNNER_TEMP/changed.txt"; then
            tools=head/tools
          fi
          PYTHONPATH="$tools" python -m oft --root head generate --check
      - name: the tools' own tests, at this change
        working-directory: head/tools
        run: python -m unittest discover -s oft/tests -t .
      - name: plan
        id: plan
        run: |
          set -euo pipefail
          if [ ! -e head/release.yaml ]; then
            echo 'plan=[]' >> "$GITHUB_OUTPUT"; echo "units=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PYTHONPATH=base/tools python -m oft --root head plan --changed "$RUNNER_TEMP/changed.txt" \
            --max-jobs 256 > "$RUNNER_TEMP/plan.json"
          echo "plan=$(jq -c .jobs "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "units=$(jq '.units | length' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          { echo "### harnesses to check"; jq -r '.units[]' "$RUNNER_TEMP/plan.json"; } >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: lint
    if: needs.lint.outputs.units != '0'
    name: check ${{ matrix.job.index }}
    # a proof check peaks at 14.5-19.4 GiB on 16 cores: the 16-core/64 GB GitHub-hosted larger runner
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.lint.outputs.plan) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          path: head
      - name: statements from the base; proofs and counterexamples from this change
        id: work
        run: |
          set -euo pipefail
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "${{ needs.lint.outputs.base }}"
          if [ "${{ needs.lint.outputs.kind }}" = release ]; then
            # a release pull request brings new facts; they were checked against the base's rendering
            echo "work=$GITHUB_WORKSPACE/head" >> "$GITHUB_OUTPUT"
          else
            for d in proofs counterexamples; do
              [ ! -d "head/$d" ] || rsync -a --delete -- "head/$d/" "base/$d/"
            done
            echo "work=$GITHUB_WORKSPACE/base" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML, hash-pinned, for this runner and for the containers
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
          python -m pip install --quiet --require-hashes --target "$RUNNER_TEMP/pydeps" -r base/tools/oft/requirements.txt
      - name: the compiled images of earlier runs on main (read only)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/dune-cache
          key: dune-${{ hashFiles('base/release.yaml') }}-${{ matrix.job.index }}-${{ github.sha }}
          restore-keys: |
            dune-${{ hashFiles('base/release.yaml') }}-
      - name: sign in to ghcr.io, where the pinned images are (needed while their packages are private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: check
        env:
          WORK: ${{ steps.work.outputs.work }}
          TOOLS: ${{ github.workspace }}/base/tools
          UNITS: ${{ matrix.job.units }}
          PROJECTS: ${{ matrix.job.projects }}
          CX_UNITS: ${{ matrix.job.counterexamples }}
          ASSETS: ${{ runner.temp }}/assets
          PYDEPS: ${{ runner.temp }}/pydeps
          CACHE: ${{ runner.temp }}/dune-cache
          GH_TOKEN: ${{ github.token }}
        run: bash base/tools/oft/ci/check-units.sh
      - name: keep the compiled images (main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/dune-cache
          key: dune-${{ hashFiles('base/release.yaml') }}-${{ matrix.job.index }}-${{ github.sha }}

  controls:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
      - name: the checker image, by digest (fail closed)
        id: image
        run: |
          set -euo pipefail
          img="$(sed -n 's/^checker=//p' head/toolchain/toolchain.lock)"
          [[ "$img" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-checker@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::toolchain/toolchain.lock must name the checker image by digest, got '$img'"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
      - name: sign in to ghcr.io, where the pinned images are (needed while their packages are private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: positive controls pass, negative controls are refused (tests/check.sh)
        run: |
          set -euo pipefail
          docker pull --quiet "${{ steps.image.outputs.image }}"
          docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/head:/work" -w /work "${{ steps.image.outputs.image }}" \
            bash -c 'dune build --root . @theories/default @tests/default && ./tests/check.sh'

  required:
    needs: [lint, check, controls]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job green, and something checked when the plan named anything
        run: |
          set -euo pipefail
          [ "${{ needs.lint.result }}" = success ] || { echo "::error::lint failed"; exit 1; }
          [ "${{ needs.controls.result }}" = success ] || { echo "::error::the controls failed"; exit 1; }
          if [ "${{ needs.lint.outputs.units }}" != 0 ]; then
            [ "${{ needs.check.result }}" = success ] || { echo "::error::a check failed or did not run"; exit 1; }
          else
            [ "${{ needs.check.result }}" = skipped ] || { echo "::error::no harness planned, yet check ran"; exit 1; }
          fi
          echo "harnesses checked: ${{ needs.lint.outputs.units }}"
