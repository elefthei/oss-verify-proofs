schema: oss-fuzz-theorems/harness/1
project: curl
harness: fuzz_bufq
rocq: OssFuzzTheorems.curl.fuzz_bufq
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an invariant: Before every operation Curl_bufq_len(&q)
  must equal the harness byte count and Curl_bufq_is_empty must agree with it; after writes/slurp/sipn
  the count must not exceed chunk_size * max_chunks.'
entry: LLVMFuzzerTestOneInput
source:
  files: []
  modified: true
  licence: NOASSERTION
  pending: true
library:
  repository: https://github.com/curl/curl
  commit: f190aa8ecea728e6ce7fb7a6250e03df4d4eaca5
  licence: NOASSERTION
modifications:
- Linked against curl at commit f190aa8e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
