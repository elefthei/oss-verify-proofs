# projects/<project>/project.yaml: one per OSS-Fuzz project at the pinned commit.
#
# This file lists every key a project.yaml may carry.  Any other key, an
# unknown enum value, a malformed digest or a repeated key is an error
# (`oft lint`, rule schema).  The prose a project page shows is rendered from
# these typed fields by tools/oft/templates and tools/oft/phrasebook.yaml;
# the only free text here is `description`, `reason_args.text` and a patch
# `summary`.
tag: oss-fuzz-theorems/project/1
root: {type: ref, name: project}
defs:
  project:
    type: object
    fields:
      schema: {type: const, value: oss-fuzz-theorems/project/1}
      project: {type: project-name}
      description: {type: text, max: 300, optional: true}     # one sentence, from OSS-Fuzz's project metadata
      homepage: {type: url, optional: true}
      language: {type: enum, values: [c, c++, go, jvm, python, rust, javascript, ruby, swift, lua]}
      oss_fuzz:
        type: object
        fields:
          path: {type: str, pattern: '^projects/[a-z0-9][a-z0-9_-]*$'}
          commit: {type: commit}
      # exactly one status per project; 5.1 of docs/status.md
      status:
        type: enum
        values: [available, language-pending, not-yet-built, needs-model,
                 no-compiler, no-harness, excluded, withdrawn, held]
      reason: {type: reason-code, optional: true}        # required unless status is available
      reason_args: {type: ref, name: reason_args, optional: true}
      library: {type: ref, name: library, optional: true}
      patches: {type: list, items: {type: ref, name: patch}, optional: true}
      withheld: {type: ref, name: withheld, optional: true}
      harnesses: {type: list, items: {type: ref, name: harness_entry}, optional: true}
      assets:
        type: object
        optional: true
        fields:
          bin: {type: ref, name: asset}
          # the upstream source trees the binaries were built from, unmodified (required when any binary's licence is
          # GPL or LGPL); with src_manifest, which says where each tree goes, and the release's recipe (release.yaml)
          src: {type: ref, name: asset, optional: true}
          src_manifest: {type: ref, name: manifest_asset, optional: true}
      build:
        type: object
        optional: true
        fields:
          system: {type: enum, values: [autotools, bazel, cmake, make, meson, scons, custom]}
          clang: {type: str, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
          builder: {type: image}

  # typed values the phrasebook sentence for (status, reason) is filled from
  reason_args:
    type: object
    fields:
      language: {type: str, optional: true, max: 40}      # "Python", "Swift", "Fortran"
      system: {type: str, optional: true, max: 40}        # a build system, "Bazel"
      framework: {type: str, optional: true, max: 40}     # a harness framework, "FuzzTest"
      dependency: {type: str, optional: true, max: 60}
      features: {type: list, items: {type: feature}, optional: true}
      same_as: {type: project-name, optional: true}
      release: {type: release-version, optional: true}
      commit: {type: commit, optional: true}
      text: {type: text, max: 400, optional: true}        # reviewed wording, for the codes that need one

  library:
    type: object
    fields:
      name: {type: str, max: 80}
      repository: {type: url}
      commit: {type: commit, optional: true}               # a git commit, or else
      archive_sha256: {type: sha256, optional: true}       # the release archive it was built from
      version: {type: str, max: 40, optional: true}
      licence: {type: spdx}                               # NOASSERTION until a person has confirmed it
      patch_count: {type: int, min: 0, optional: true}    # every patch applied, listed or not; absent where some builds are not published

  # a patch applied to the library whose text and summary are public
  patch:
    type: object
    fields:
      id: {type: str, pattern: '^[a-z0-9][a-z0-9-]*$'}
      summary: {type: text, max: 400}
      upstream: {type: enum, values: [reported, fixed-upstream, not-a-defect]}
      url: {type: url, optional: true}

  # what this release holds back, by reason only (never what, never how many)
  withheld:
    type: object
    fields:
      source_bundle: {type: bool, optional: true}         # GPL or LGPL builds wait for their complete corresponding source
      unpublished: {type: bool, optional: true}           # some builds or statements are not in this release yet

  harness_entry:
    type: object
    fields:
      name: {type: harness-name}
      status: {type: enum, values: [included, not-included]}
      origin: {type: enum, values: [oss-fuzz, upstream, this-repository], optional: true}
      reason: {type: reason-code, optional: true}         # required when not-included
      reason_args: {type: ref, name: reason_args, optional: true}

  asset:
    type: object
    fields:
      release: {type: release-tag}
      file: {type: str, pattern: '^[a-z0-9][a-z0-9_-]*-(bin|src)\.tar\.zst$'}
      bytes: {type: int, min: 1}
      sha256: {type: sha256}
      # a file GitHub cannot take whole (2 GiB per release file) ships as numbered parts of its one stream, `cat` of
      # them in order being the file; the fields above stay the whole stream's. The parts are .000, .001, ... in
      # order, each with its own bytes and SHA-256; a bin asset and a src asset ship them the same way. ABSENT and
      # PRESENT-BUT-EMPTY are different: a record with no `parts` is one whole file, and a `parts` that is there
      # says parts, so [], {}, "", null and a part of 0 bytes are refused here, and every reader (oft fetch,
      # oft generate, the lint) refuses them too rather than falling back to the whole file.
      parts: {type: list, min: 1, items: {type: ref, name: asset_part}, optional: true}

  asset_part:
    type: object
    fields:
      file: {type: str, pattern: '^[a-z0-9][a-z0-9_-]*-(bin|src)\.tar\.zst\.[0-9]{3}$'}
      bytes: {type: int, min: 1}
      sha256: {type: sha256}

  # the source asset's manifest: one row per tree (its upstream URL and commit, or its sha256) and where the build
  # lays it down
  manifest_asset:
    type: object
    fields:
      release: {type: release-tag}
      file: {type: str, pattern: '^[a-z0-9][a-z0-9_-]*-src\.MANIFEST\.tsv$'}
      bytes: {type: int, min: 1}
      sha256: {type: sha256}
